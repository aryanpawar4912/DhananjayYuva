{% extends 'member/base.html' %}

{% block content %}
<div class="w-full max-w-4xl mx-auto px-2 sm:px-4 lg:px-8 py-2 sm:py-6">
    <div class="relative bg-white/95 dark:bg-slate-950/95 backdrop-blur-2xl border border-slate-200/80 dark:border-slate-800/80 rounded-3xl sm:rounded-[2.5rem] shadow-2xl shadow-slate-200/50 dark:shadow-none overflow-hidden flex flex-col h-[calc(100dvh-5.5rem)] sm:h-[750px] transition-all">
        
        <!-- Top Header -->
        <div class="px-4 sm:px-6 py-3.5 bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl border-b border-slate-100 dark:border-slate-800/80 flex items-center justify-between shrink-0 z-10">
            <div class="flex items-center gap-3">
                <div class="relative p-0.5 rounded-full bg-gradient-to-tr from-emerald-500 via-teal-500 to-cyan-500 shadow-md shadow-emerald-500/20">
                    <div class="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-slate-900 flex items-center justify-center text-white font-extrabold text-xs sm:text-sm border-2 border-white dark:border-slate-950">
                        AD
                    </div>
                    <span class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-white dark:border-slate-950 rounded-full ring-2 ring-emerald-500/20 animate-pulse"></span>
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <h1 class="text-sm sm:text-base font-black text-slate-900 dark:text-white tracking-tight leading-tight">Admin Support</h1>
                        <i data-lucide="badge-check" class="w-4 h-4 text-emerald-500 fill-emerald-500/20"></i>
                    </div>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium flex items-center gap-1.5">
                        <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Active now • Co-op Support Desk
                    </p>
                </div>
            </div>
            
            <div class="flex items-center gap-1 sm:gap-2 text-slate-600 dark:text-slate-300">
                <button type="button" onclick="alert('Calling admin desk helpline...')" class="w-9 h-9 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center transition active:scale-95" title="Call Support">
                    <i data-lucide="phone" class="w-4 h-4"></i>
                </button>
                <button type="button" onclick="loadChat()" class="w-9 h-9 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center transition active:scale-95" title="Refresh Messages">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- Chat Feed Area -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 bg-slate-50/50 dark:bg-slate-950/40 scroll-smooth">
            <div class="flex flex-col items-center justify-center h-full text-slate-400 space-y-3">
                <div class="w-8 h-8 border-3 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-xs font-bold tracking-wide uppercase">Loading conversation...</p>
            </div>
        </div>

        <!-- Quick Interaction Chips -->
        <div class="px-4 py-2 bg-white/50 dark:bg-slate-950/50 backdrop-blur-md border-t border-slate-100 dark:border-slate-800/80 flex items-center gap-2 overflow-x-auto scrollbar-none shrink-0">
            <button onclick="sendQuickMessage('What is my current loan status?')" class="px-3.5 py-1.5 rounded-full bg-slate-100 dark:bg-slate-900 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-600 active:scale-95 text-xs font-semibold text-slate-700 dark:text-slate-300 transition-all shrink-0 border border-slate-200/60 dark:border-slate-800 flex items-center gap-1.5 shadow-xs">
                <span>⚡</span> Loan Status
            </button>
            <button onclick="sendQuickMessage('Check my savings pool balance.')" class="px-3.5 py-1.5 rounded-full bg-slate-100 dark:bg-slate-900 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-600 active:scale-95 text-xs font-semibold text-slate-700 dark:text-slate-300 transition-all shrink-0 border border-slate-200/60 dark:border-slate-800 flex items-center gap-1.5 shadow-xs">
                <span>💰</span> Savings Balance
            </button>
            <button onclick="sendQuickMessage('When is the next co-op meeting?')" class="px-3.5 py-1.5 rounded-full bg-slate-100 dark:bg-slate-900 hover:bg-emerald-500 hover:text-white dark:hover:bg-emerald-600 active:scale-95 text-xs font-semibold text-slate-700 dark:text-slate-300 transition-all shrink-0 border border-slate-200/60 dark:border-slate-800 flex items-center gap-1.5 shadow-xs">
                <span>📅</span> Next Meeting
            </button>
        </div>

        <!-- Quoted Reply Banner -->
        <div id="reply-preview-bar" class="hidden px-4 py-2 bg-emerald-50/80 dark:bg-emerald-950/40 border-t border-emerald-200/50 dark:border-emerald-800/50 items-center justify-between shrink-0">
            <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-1 h-8 bg-emerald-500 rounded-full"></div>
                <div class="truncate text-xs">
                    <p class="font-bold text-emerald-700 dark:text-emerald-400" id="reply-author">Replying to Admin</p>
                    <p class="text-slate-600 dark:text-slate-300 truncate" id="reply-text">Message snippet...</p>
                </div>
            </div>
            <button type="button" onclick="cancelReplyQuote()" class="text-slate-400 hover:text-rose-500 p-1 rounded-full transition">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Image Upload Preview Bar -->
        <div id="image-preview-bar" class="hidden px-4 py-2 bg-slate-100 dark:bg-slate-900 border-t border-slate-200/60 dark:border-slate-800 items-center justify-between shrink-0">
            <div class="flex items-center gap-2 min-w-0">
                <i data-lucide="image" class="w-4 h-4 text-emerald-500 shrink-0"></i>
                <span id="preview-filename" class="text-xs font-medium text-slate-700 dark:text-slate-300 truncate"></span>
            </div>
            <button type="button" onclick="clearSelectedImage()" class="text-slate-400 hover:text-rose-500 p-1 rounded-full transition">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Popover Emoji Picker -->
        <div id="emoji-picker" class="hidden absolute bottom-20 right-4 sm:right-16 z-30 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-3 shadow-2xl grid grid-cols-6 gap-2 w-64 animate-in fade-in slide-in-from-bottom-2">
            <button type="button" onclick="insertEmoji('😊')" class="hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-xl text-lg transition">😊</button>
            <button type="button" onclick="insertEmoji('😂')" class="hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-xl text-lg transition">😂</button>
            <button type="button" onclick="insertEmoji('👍')" class="hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-xl text-lg transition">👍</button>
            <button type="button" onclick="insertEmoji('❤️')" class="hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-xl text-lg transition">❤️</button>
            <button type="button" onclick="insertEmoji('🙏')" class="hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-xl text-lg transition">🙏</button>
            <button type="button" onclick="insertEmoji('🔥')" class="hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-xl text-lg transition">🔥</button>
            <button type="button" onclick="insertEmoji('💰')" class="hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-xl text-lg transition">💰</button>
            <button type="button" onclick="insertEmoji('⚡')" class="hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-xl text-lg transition">⚡</button>
            <button type="button" onclick="insertEmoji('📄')" class="hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-xl text-lg transition">📄</button>
            <button type="button" onclick="insertEmoji('✅')" class="hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-xl text-lg transition">✅</button>
            <button type="button" onclick="insertEmoji('🎉')" class="hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-xl text-lg transition">🎉</button>
            <button type="button" onclick="insertEmoji('❓')" class="hover:bg-slate-100 dark:hover:bg-slate-800 p-2 rounded-xl text-lg transition">❓</button>
        </div>

        <!-- Messaging Input Bar -->
        <div class="p-3 sm:p-4 bg-white dark:bg-slate-950 border-t border-slate-100 dark:border-slate-800/80 shrink-0">
            <form id="chat-form" class="flex items-center gap-2">
                <input type="file" id="image-input" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
                
                <div class="relative flex-1 flex items-center bg-slate-100/80 dark:bg-slate-900/80 rounded-full border border-slate-200/80 dark:border-slate-800 px-3.5 sm:px-4 py-2 sm:py-2.5 focus-within:ring-2 focus-within:ring-emerald-500/50 focus-within:border-emerald-500 transition-all shadow-inner">
                    <input type="text" id="chat-input" placeholder="Message admin..." autocomplete="off" class="w-full bg-transparent text-slate-900 dark:text-slate-100 placeholder-slate-400 text-xs sm:text-sm focus:outline-none pr-14">
                    
                    <div class="absolute right-2 flex items-center gap-1 text-slate-400">
                        <button type="button" onclick="toggleEmojiPicker()" class="hover:text-amber-500 transition p-1 rounded-full" title="Insert Emoji">
                            <i data-lucide="smile" class="w-4 h-4"></i>
                        </button>
                        <button type="button" onclick="document.getElementById('image-input').click()" class="hover:text-emerald-500 transition p-1 rounded-full" title="Attach Image">
                            <i data-lucide="image" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="send-btn" class="inline-flex items-center justify-center w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-gradient-to-tr from-emerald-500 via-teal-500 to-emerald-600 hover:opacity-95 active:scale-95 text-white transition-all shadow-md shadow-emerald-500/25 shrink-0 disabled:opacity-50">
                    <i data-lucide="send" class="w-4 h-4 sm:w-5 sm:h-5"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
const chatMessagesContainer = document.getElementById('chat-messages');
const chatForm = document.getElementById('chat-form');
const chatInput = document.getElementById('chat-input');
const imageInput = document.getElementById('image-input');
const imagePreviewBar = document.getElementById('image-preview-bar');
const previewFilename = document.getElementById('preview-filename');
const replyPreviewBar = document.getElementById('reply-preview-bar');
const replyAuthor = document.getElementById('reply-author');
const replyText = document.getElementById('reply-text');
const emojiPicker = document.getElementById('emoji-picker');
const sendBtn = document.getElementById('send-btn');

const csrfTokenMeta = document.querySelector('meta[name="csrf-token"]');
const csrfToken = csrfTokenMeta ? csrfTokenMeta.content : '';

let activeQuoteMessage = null;
let lastRenderedDate = null;

const scrollToBottom = () => {
    chatMessagesContainer.scrollTo({
        top: chatMessagesContainer.scrollHeight,
        behavior: 'smooth'
    });
};

const formatDividerDate = (dateStr) => {
    if (!dateStr) return 'Today';
    const date = new Date(dateStr);
    const today = new Date();
    const yesterday = new Date();
    yesterday.setDate(today.getDate() - 1);

    if (date.toDateString() === today.toDateString()) return 'Today';
    if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';
    return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
};

const renderDateDivider = (dateLabel) => {
    const divider = document.createElement('div');
    divider.className = 'flex items-center justify-center my-4';
    divider.innerHTML = `
        <span class="px-3.5 py-1 bg-slate-200/70 dark:bg-slate-800/80 text-slate-600 dark:text-slate-400 text-[10px] sm:text-xs font-bold rounded-full uppercase tracking-wider backdrop-blur-sm shadow-xs border border-slate-300/40 dark:border-slate-700/40">
            ${dateLabel}
        </span>
    `;
    chatMessagesContainer.appendChild(divider);
};

const renderMessage = (message) => {
    const isAdmin = message.sender === 'admin';
    const msgDateLabel = formatDividerDate(message.created_at);

    // Insert date header if dynamic date changes
    if (msgDateLabel !== lastRenderedDate) {
        renderDateDivider(msgDateLabel);
        lastRenderedDate = msgDateLabel;
    }

    const wrapper = document.createElement('div');
    wrapper.className = `group relative flex w-full my-1.5 animate-in fade-in slide-in-from-bottom-2 duration-300 ${isAdmin ? 'justify-start' : 'justify-end'}`;

    let mediaHTML = '';
    if (message.image_url) {
        mediaHTML = `<img src="${message.image_url}" alt="Attachment" class="rounded-xl max-w-full max-h-60 object-cover mb-2 border border-black/10">`;
    }

    let quoteHTML = '';
    if (message.reply_to) {
        quoteHTML = `
            <div class="mb-1.5 p-2 rounded-lg bg-black/5 dark:bg-white/10 border-l-2 border-emerald-500 text-[11px] truncate">
                <span class="font-bold opacity-80">${escapeHTML(message.reply_to.sender)}</span>: ${escapeHTML(message.reply_to.content)}
            </div>
        `;
    }

    wrapper.innerHTML = `
        <div class="relative max-w-[85%] sm:max-w-[70%] flex flex-col ${isAdmin ? 'items-start' : 'items-end'}">
            
            <!-- Hover Action Menu -->
            <div class="absolute -top-3 ${isAdmin ? 'right-0' : 'left-0'} opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity flex items-center gap-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-full px-2 py-0.5 shadow-md z-20">
                <button type="button" onclick="copyMessageText('${escapeJS(message.content)}')" class="p-1 text-slate-400 hover:text-emerald-500 transition" title="Copy text">
                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                </button>
                <button type="button" onclick="setReplyQuote('${isAdmin ? 'Admin' : 'You'}', '${escapeJS(message.content)}')" class="p-1 text-slate-400 hover:text-emerald-500 transition" title="Quote reply">
                    <i data-lucide="reply" class="w-3.5 h-3.5"></i>
                </button>
            </div>

            <div class="rounded-2xl px-4 py-2.5 ${
                isAdmin 
                ? 'bg-slate-100 dark:bg-slate-800/90 text-slate-900 dark:text-slate-100 rounded-tl-xs shadow-xs' 
                : 'bg-gradient-to-r from-emerald-500 via-teal-500 to-emerald-600 text-white rounded-tr-xs shadow-md shadow-emerald-500/10'
            } text-xs sm:text-sm leading-relaxed break-words font-medium">
                ${quoteHTML}
                ${mediaHTML}
                ${escapeHTML(message.content || '')}
            </div>
            
            <span class="text-[9px] text-slate-400 dark:text-slate-500 mt-1 px-1 font-semibold flex items-center gap-1">
                ${message.created_at || 'Just now'}
                ${!isAdmin ? '<i data-lucide="check-check" class="w-3 h-3 text-emerald-500 inline"></i>' : ''}
            </span>
        </div>
    `;
    chatMessagesContainer.appendChild(wrapper);
};

function escapeHTML(str) {
    return (str || '').replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
}

function escapeJS(str) {
    return (str || '').replace(/'/g, "\\'").replace(/\n/g, " ");
}

function copyMessageText(text) {
    navigator.clipboard.writeText(text);
    const toast = document.createElement('div');
    toast.className = 'fixed bottom-16 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-3 py-1.5 rounded-full shadow-lg z-50 animate-in fade-in';
    toast.textContent = 'Copied to clipboard!';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 1800);
}

function setReplyQuote(author, text) {
    activeQuoteMessage = { author, text };
    replyAuthor.textContent = `Replying to ${author}`;
    replyText.textContent = text;
    replyPreviewBar.classList.remove('hidden');
    replyPreviewBar.classList.add('flex');
    chatInput.focus();
}

function cancelReplyQuote() {
    activeQuoteMessage = null;
    replyPreviewBar.classList.add('hidden');
    replyPreviewBar.classList.remove('flex');
}

function toggleEmojiPicker() {
    emojiPicker.classList.toggle('hidden');
}

function insertEmoji(emoji) {
    chatInput.value += emoji;
    chatInput.focus();
    emojiPicker.classList.add('hidden');
}

function sendQuickMessage(text) {
    chatInput.value = text;
    chatForm.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
}

function handleImageSelect(event) {
    const file = event.target.files[0];
    if (file) {
        previewFilename.textContent = file.name;
        imagePreviewBar.classList.remove('hidden');
        imagePreviewBar.classList.add('flex');
    }
}

function clearSelectedImage() {
    imageInput.value = '';
    imagePreviewBar.classList.add('hidden');
    imagePreviewBar.classList.remove('flex');
}

const loadChat = async () => {
    try {
        const response = await fetch('/api/chat/', { method: 'GET', credentials: 'include' });
        if (!response.ok) throw new Error('Unable to load chat history');
        const data = await response.json();
        
        chatMessagesContainer.innerHTML = '';
        lastRenderedDate = null;

        if (!data.messages || data.messages.length === 0) {
            chatMessagesContainer.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-center text-slate-400 p-6 space-y-3">
                    <div class="w-14 h-14 rounded-full bg-slate-100 dark:bg-slate-900 flex items-center justify-center text-emerald-500 shadow-inner">
                        <i data-lucide="sparkles" class="w-6 h-6"></i>
                    </div>
                    <p class="text-sm font-bold text-slate-700 dark:text-slate-300">Direct Support Channel</p>
                    <p class="text-xs text-slate-400 max-w-xs">Send a note or tap a prompt below to start talking with admin.</p>
                </div>
            `;
        } else {
            data.messages.forEach(renderMessage);
        }
        
        scrollToBottom();
        if (typeof lucide !== 'undefined') lucide.createIcons();
    } catch (err) {
        console.error(err);
        chatMessagesContainer.innerHTML = '<div class="flex items-center justify-center h-full text-center text-rose-500 text-xs font-semibold">Failed to load conversation.</div>';
    }
};

chatForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const content = chatInput.value.trim();
    const hasImage = imageInput.files.length > 0;
    if (!content && !hasImage) return;

    sendBtn.disabled = true;

    try {
        let body;
        let headers = { 'X-CSRFToken': csrfToken };

        if (hasImage) {
            body = new FormData();
            body.append('content', content);
            body.append('image', imageInput.files[0]);
            if (activeQuoteMessage) body.append('reply_to', JSON.stringify(activeQuoteMessage));
        } else {
            headers['Content-Type'] = 'application/json';
            body = JSON.stringify({ 
                content,
                reply_to: activeQuoteMessage
            });
        }

        const response = await fetch('/api/chat/', {
            method: 'POST',
            credentials: 'include',
            headers,
            body
        });
        
        if (!response.ok) {
            const data = await response.json();
            throw new Error(data.error || 'Message not sent');
        }
        
        const data = await response.json();
        
        if (chatMessagesContainer.querySelector('.animate-spin') || chatMessagesContainer.querySelector('i[data-lucide="sparkles"]')) {
            chatMessagesContainer.innerHTML = '';
        }

        renderMessage(data);
        chatInput.value = '';
        clearSelectedImage();
        cancelReplyQuote();
        scrollToBottom();
        if (typeof lucide !== 'undefined') lucide.createIcons();
    } catch (err) {
        console.error(err);
        alert(err.message || 'Unable to send message.');
    } finally {
        sendBtn.disabled = false;
    }
});

loadChat();
</script>
{% endblock %}
