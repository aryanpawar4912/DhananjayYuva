{% extends 'member/base.html' %}
{% block content %}
<div class="max-w-3xl mx-auto space-y-8">
    <h1 class="text-2xl font-bold text-slate-800 dark:text-white tracking-tight">Account Settings</h1>
    
    <!-- Profile Info Form -->
    <div class="bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 transition-colors">
        
        <!-- Avatar Header Section -->
        <div class="flex items-center gap-5 mb-8 pb-6 border-b border-slate-100 dark:border-slate-800">
            <div id="avatar-container" class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white font-bold text-2xl flex items-center justify-center shadow-lg shadow-emerald-600/30 transform transition-transform hover:scale-105 select-none">
                <span id="avatar-initial">--</span>
            </div>
            <div>
                <h2 class="text-lg font-bold text-slate-800 dark:text-white">Personal Details</h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Manage your profile information and contact details</p>
            </div>
        </div>

        <form id="profile-form" class="space-y-6">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Username</label>
                    <input type="text" id="prof-username" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-500 dark:text-slate-400 cursor-not-allowed" disabled>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Full Name</label>
                    <input type="text" id="prof-name" class="w-full px-4 py-3 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Email Address</label>
                    <input type="email" id="prof-email" class="w-full px-4 py-3 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Phone Number</label>
                    <input type="text" id="prof-phone" class="w-full px-4 py-3 bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none transition">
                </div>
            </div>
            
            <button type="submit" id="save-prof-btn" class="bg-emerald-600 text-white font-bold py-3 px-8 rounded-xl hover:bg-emerald-700 transition shadow-sm shadow-emerald-600/20">Save Changes</button>
            <div id="prof-msg" class="mt-4 text-sm font-medium hidden"></div>
        </form>
    </div>

    <!-- KYC Document Upload -->
    <div class="bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 transition-colors">
        <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-2">KYC Document Upload</h2>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">Upload an official document (PAN, or Salary Slip) for verification purposes.</p>
        
        <form id="upload-form" class="flex flex-col sm:flex-row gap-4 items-center bg-slate-50 dark:bg-slate-800/40 p-4 rounded-xl border border-dashed border-slate-300 dark:border-slate-700">
            {% csrf_token %}
            <input type="file" id="doc-file" class="block w-full text-sm text-slate-500 dark:text-slate-400 file:mr-4 file:py-2.5 file:px-6 file:rounded-full file:border-0 file:bg-white dark:file:bg-slate-800 file:border file:border-slate-200 dark:file:border-slate-700 file:text-slate-700 dark:file:text-slate-300 hover:file:bg-slate-100 dark:hover:file:bg-slate-700 cursor-pointer transition" required>
            <button type="submit" id="upload-btn" class="w-full sm:w-auto bg-slate-900 dark:bg-slate-800 text-white font-medium px-8 py-2.5 rounded-xl hover:bg-slate-800 dark:hover:bg-slate-700 transition shadow-sm">Upload File</button>
        </form>
        <div id="upload-status" class="mt-4 text-sm font-medium hidden"></div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    
    // Helper function to update avatar initial letter dynamically
    const updateAvatarInitial = (name) => {
        const initialSpan = document.getElementById('avatar-initial');
        if (name && name.trim().length > 0) {
            initialSpan.innerText = name.trim().charAt(0).toUpperCase();
        } else {
            initialSpan.innerText = '?';
        }
    };

    // Live update avatar when typing in the Full Name field
    document.getElementById('prof-name').addEventListener('input', function(e) {
        updateAvatarInitial(e.target.value);
    });

    // 1. Fetch Existing Profile Data
    fetch('/api/profile/')
        .then(res => res.json())
        .then(data => {
            document.getElementById('prof-username').value = data.username || '';
            const name = data.name || '';
            document.getElementById('prof-name').value = name;
            document.getElementById('prof-email').value = data.email || '';
            document.getElementById('prof-phone').value = data.phone || '';
            
            // Set Avatar initial from fetched data
            updateAvatarInitial(name);
        })
        .catch(err => console.error("Error fetching profile:", err));

    // 2. Handle Saving Profile Changes (JSON Post)
    document.getElementById('profile-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const csrfToken = document.querySelector('#profile-form [name=csrfmiddlewaretoken]').value;
        const msgBox = document.getElementById('prof-msg');
        const btn = document.getElementById('save-prof-btn');
        
        btn.innerText = "Saving...";
        btn.disabled = true;
        
        const currentName = document.getElementById('prof-name').value;

        fetch('/api/profile/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({
                name: currentName,
                email: document.getElementById('prof-email').value,
                phone: document.getElementById('prof-phone').value
            })
        })
        .then(res => res.json())
        .then(data => {
            btn.innerText = "Save Changes";
            btn.disabled = false;
            msgBox.innerText = data.message || "Profile updated successfully.";
            msgBox.className = "mt-4 px-4 py-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900/50 rounded-xl text-sm font-medium text-emerald-700 dark:text-emerald-300 block";
            updateAvatarInitial(currentName);
        })
        .catch(() => {
            btn.innerText = "Save Changes";
            btn.disabled = false;
            msgBox.innerText = "Failed to update profile.";
            msgBox.className = "mt-4 px-4 py-3 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 rounded-xl text-sm font-medium text-red-700 dark:text-red-300 block";
        });
    });

    // 3. Handle File Uploads (FormData Post)
    document.getElementById('upload-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const csrfToken = document.querySelector('#upload-form [name=csrfmiddlewaretoken]').value;
        const fileInput = document.getElementById('doc-file');
        const btn = document.getElementById('upload-btn');
        const statusBox = document.getElementById('upload-status');
        
        if (fileInput.files.length === 0) return;

        btn.innerText = "Uploading...";
        btn.disabled = true;
        
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('description', 'User KYC Document');

        fetch('/api/upload-doc/', {
            method: 'POST',
            headers: { 'X-CSRFToken': csrfToken }, 
            body: formData 
        })
        .then(res => res.json())
        .then(data => {
            btn.innerText = "Upload File";
            btn.disabled = false;
            
            if(data.message) {
                statusBox.innerText = data.message;
                statusBox.className = "mt-4 px-4 py-3 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900/50 rounded-xl text-sm font-medium text-emerald-700 dark:text-emerald-300 block";
                fileInput.value = '';
            } else {
                statusBox.innerText = data.error || "An error occurred.";
                statusBox.className = "mt-4 px-4 py-3 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 rounded-xl text-sm font-medium text-red-700 dark:text-red-300 block";
            }
        })
        .catch(() => {
            btn.innerText = "Upload File";
            btn.disabled = false;
            statusBox.innerText = "Server error uploading file.";
            statusBox.className = "mt-4 px-4 py-3 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 rounded-xl text-sm font-medium text-red-700 dark:text-red-300 block";
        });
    });
});
</script>
{% endblock %}
