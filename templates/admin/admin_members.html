{% extends 'admin/admin_base.html' %}
{% block title %}Dhananjay Yuva - Member Management{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center bg-white p-6 rounded-xl shadow-sm border border-gray-100">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">Member Management</h2>
            <p class="text-sm text-gray-500 mt-1">Manage all registered organization members.</p>
        </div>
        <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
            <i class="fa-solid fa-user-plus"></i> Add New Member
        </button>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-50 text-gray-600 uppercase text-xs tracking-wider border-b border-gray-100">
                    <th class="px-6 py-4 font-semibold">Name</th>
                    <th class="px-6 py-4 font-semibold">Email</th>
                    <th class="px-6 py-4 font-semibold">Role</th>
                    <th class="px-6 py-4 font-semibold">Status</th>
                    <th class="px-6 py-4 font-semibold text-right">Actions</th>
                </tr>
            </thead>
            <tbody id="membersTableBody" class="divide-y divide-gray-100 text-sm text-gray-700"></tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div id="memberModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6">
        <h3 id="modalTitle" class="font-bold text-gray-800 text-lg mb-4">Add Member</h3>
        <form id="memberForm" class="space-y-4">
            <input type="hidden" id="memberId">
            <input type="text" id="memberName" placeholder="Full Name" required class="w-full px-4 py-2 border rounded-lg">
            <input type="email" id="memberEmail" placeholder="Email Address" required class="w-full px-4 py-2 border rounded-lg">
            <input type="text" id="memberPhone" placeholder="Phone Number" class="w-full px-4 py-2 border rounded-lg">
            <select id="memberRole" class="w-full px-4 py-2 border rounded-lg bg-white">
                <option value="Core Member">Core Member</option>
                <option value="Volunteer">Volunteer</option>
                <option value="Participant">Participant</option>
            </select>
            <select id="memberStatus" class="w-full px-4 py-2 border rounded-lg bg-white">
                <option value="Active">Active</option>
                <option value="Pending">Pending</option>
                <option value="Inactive">Inactive</option>
            </select>
            <div class="flex justify-end space-x-3 pt-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-100 rounded-lg">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg">Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", loadMembers);

    function loadMembers() {
        fetch('/admin-panel/api/v1/members/')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('membersTableBody');
                tbody.innerHTML = '';
                data.forEach(m => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 font-medium">${m.name}</td>
                            <td class="px-6 py-4 text-gray-500">${m.email}</td>
                            <td class="px-6 py-4">${m.role}</td>
                            <td class="px-6 py-4"><span class="px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs">${m.status}</span></td>
                            <td class="px-6 py-4 text-right space-x-2">
                                <button onclick="editMember(${m.id})" class="text-blue-600"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteMember(${m.id})" class="text-red-600"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>`;
                });
            });
    }

    function openModal() { document.getElementById('memberForm').reset(); document.getElementById('memberId').value = ''; document.getElementById('memberModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('memberModal').classList.add('hidden'); }

    document.getElementById('memberForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('memberId').value;
        const data = {
            name: document.getElementById('memberName').value,
            email: document.getElementById('memberEmail').value,
            phone: document.getElementById('memberPhone').value,
            role: document.getElementById('memberRole').value,
            status: document.getElementById('memberStatus').value
        };
        fetch(id ? `/admin-panel/api/v1/members/${id}/` : '/admin-panel/api/v1/members/', {
            method: id ? 'PUT' : 'POST',
            headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
            body: JSON.stringify(data)
        }).then(res => { if(res.ok) { closeModal(); loadMembers(); } });
    });

    function editMember(id) {
        fetch(`/admin-panel/api/v1/members/${id}/`).then(res => res.json()).then(m => {
            document.getElementById('memberId').value = m.id;
            document.getElementById('memberName').value = m.name;
            document.getElementById('memberEmail').value = m.email;
            document.getElementById('memberPhone').value = m.phone || '';
            document.getElementById('memberRole').value = m.role;
            document.getElementById('memberStatus').value = m.status;
            document.getElementById('memberModal').classList.remove('hidden');
        });
    }

    function deleteMember(id) {
        if(confirm('Delete member?')) {
            fetch(`/admin-panel/api/v1/members/${id}/`, {method: 'DELETE', headers: {'X-CSRFToken': getCookie('csrftoken')}})
                .then(res => { if(res.ok) loadMembers(); });
        }
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
</script>
{% endblock %}
